name: release-published

on:
  release:
    types: [published]

concurrency:
  group: release-published-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build
        run: bash scripts/build.sh release

      - name: Verify release archives
        run: test -n "$(find build/archives -type f -name '*.zip' -print -quit)"

      - name: Upload release archives
        uses: softprops/action-gh-release@v3
        with:
          files: build/archives/*
          tag_name: ${{ github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Docker binaries
        uses: actions/upload-artifact@v7
        with:
          name: docker-binaries
          path: build/docker/
          if-no-files-found: error
          retention-days: 1

  docker:
    name: docker (${{ matrix.variant }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: alpine
            dockerfile: ./scripts/dockerfiles/Dockerfile.alpine
            latest_tag: latest-alpine
            tag_suffix: -alpine
          - variant: debian
            dockerfile: ./scripts/dockerfiles/Dockerfile.debian
            latest_tag: latest
            tag_suffix: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Download Docker binaries
        uses: actions/download-artifact@v8
        with:
          name: docker-binaries
          path: build/docker

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ matrix.latest_tag }},enable=${{ !github.event.release.prerelease }}
            type=raw,value=${{ github.event.release.tag_name }}${{ matrix.tag_suffix }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TARGETPLATFORM
